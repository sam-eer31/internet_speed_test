<svg xmlns="http://www.w3.org/2000/svg" width="220" height="54" viewBox="0 0 220 54">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b8f9" />
      <stop offset="100%" stop-color="#0045e0" />
    </linearGradient>
    <!-- Shadow/Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00b8f9" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rect with shadow and rounded corners -->
  <rect x="6" y="4" width="208" height="44" rx="22" fill="url(#brandGrad)" filter="url(#glow)" />
  <!-- Border overlay for glassmorphic crispness -->
  <rect x="6.5" y="4.5" width="207" height="43" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  <!-- Text with bold tracking and sans-serif typography -->
  <text x="110" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.8" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    ⚡ RUN SPEED TEST
  </text>
</svg>
